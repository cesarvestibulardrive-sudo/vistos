<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vistos</title>
  <meta name="theme-color" content="#1B2430" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/bootstrap-scoped.css" />
  <link rel="stylesheet" href="css/bootstrap-icons-scoped.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Tela de login -->
  <div id="tela-login" class="cartao">
    <h1>Vistos</h1>
    <p class="subtitulo">Gestão de turmas, vistos e ocorrências</p>
    <button id="btn-login-google" class="btn-primario">Entrar com Google</button>
  </div>

  <!-- Tela de acesso negado -->
  <div id="tela-negado" class="cartao escondido">
    <div class="carimbo">Acesso negado</div>
    <p>Esta conta ainda não está cadastrada no Vistos.<br />Peça ao administrador do sistema para cadastrar seu e-mail.</p>
    <button id="btn-logout-negado" class="btn-secundario">Trocar de conta</button>
  </div>

  <!-- App principal -->
  <div id="tela-app" class="escondido">
    <div class="topo-app">
      <div class="topo-app-linha1">
        <h1>Vistos</h1>
        <div class="topo-acoes">
          <span id="status-conexao" class="status">—</span>
          <span id="usuario-nome" class="usuario-nome"></span>
          <button id="btn-tema" class="btn-secundario btn-sair" title="Alternar modo escuro">🌙</button>
          <button id="btn-logout" class="btn-secundario btn-sair">Sair</button>
        </div>
      </div>
      <nav class="nav-inferior">
        <button class="aba ativa" data-aba="turmas"><span class="nav-icone nav-icone-bi bi-clipboard"></span><span class="nav-rotulo">Turmas</span></button>
        <button class="aba" data-aba="visto"><span class="nav-icone nav-icone-bi bi-check2-circle"></span><span class="nav-rotulo">Visto</span></button>
        <button class="aba" data-aba="chamada"><span class="nav-icone nav-icone-bi bi-calendar3"></span><span class="nav-rotulo">Chamada</span></button>
        <button class="aba" data-aba="ocorrencia"><span class="nav-icone nav-icone-bi bi-exclamation-triangle"></span><span class="nav-rotulo">Ocorr.</span></button>
        <button class="aba" data-aba="seminario"><span class="nav-icone nav-icone-bi bi-people"></span><span class="nav-rotulo">Seminário</span></button>
        <button class="aba" data-aba="relatorio"><span class="nav-icone nav-icone-bi bi-bar-chart"></span><span class="nav-rotulo">Relatório</span></button>
        <button class="aba" data-aba="admin" style="display:none;"><span class="nav-icone nav-icone-bi bi-wrench-adjustable"></span><span class="nav-rotulo">Admin</span></button>
      </nav>
    </div>

    <div class="conteudo-app">
      <div id="painel-turmas" class="painel-aba"></div>
      <div id="painel-visto" class="painel-aba" style="display:none;"></div>
      <div id="painel-chamada" class="painel-aba" style="display:none;"></div>
      <div id="painel-ocorrencia" class="painel-aba" style="display:none;"></div>
      <div id="painel-seminario" class="painel-aba" style="display:none;"></div>
      <div id="painel-relatorio" class="painel-aba" style="display:none;"></div>
      <div id="painel-admin" class="painel-aba" style="display:none;"></div>
    </div>
  </div>

  <!-- Modal genérico (usado para novo/editar escola, turma, disciplina) -->
  <div id="modal-fundo" class="modal-fundo escondido">
    <div id="modal-caixa" class="modal-caixa"></div>
  </div>

  <footer id="rodape-marca" class="rodape-marca">Desenvolvido por Cesar Amaral</footer>

  <!-- Geração de PDF (relatório atitudinal) — só carregado quando necessário pra não pesar o 1º acesso. -->
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/vendor/jspdf.plugin.autotable.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/usuarios.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/turmas.js"></script>
  <script src="js/visto.js"></script>
  <script src="js/chamada.js"></script>
  <script src="js/ocorrencia.js"></script>
  <script src="js/seminario.js"></script>
  <script src="js/pesos.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
